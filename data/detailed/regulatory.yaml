PK13:
  id: "PK13"
  title: "EU Packaging and Packaging Waste Regulation (PPWR)"
  category: "Regulatory"
  status: "verified"
  summary: "Mandates recyclability performance grades and strict limits on empty space ratios for commercial packaging."
  effectiveDate: "2026-01-01"
PK14:
  id: "PK14"
  title: "Extended Producer Responsibility (EPR) Fee Structures"
  category: "Regulatory"
  status: "verified"
  summary: "Fees scale proportionally with material recyclability grade and recycled content percentages."
  effectiveDate: "2026-01-01"
PK15:
  id: "PK15"
  title: "Single-Use Plastics Directive Compliance"
  category: "Regulatory"
  status: "verified"
  summary: "Prohibits specific problematic polymers and enforces reduction targets for high-impact formats."
  effectiveDate: "2026-01-01"
PK16:
  id: "PK16"
  title: "Green Claims Substantiation Standards"
  category: "Regulatory"
  status: "verified"
  summary: "Requires transparent, verifiable lifecycle data before marketing packaging as eco-friendly or sustainable."
  effectiveDate: "2026-01-01"
PK17:
  id: "PK17"
  title: "Food-Contact Material Migration Limits"
  category: "Regulatory"
  status: "verified"
  summary: "Regulates chemical leachates and PCR purity thresholds for cosmetic and personal care contact layers."
  effectiveDate: "2026-01-01"
PK18:
  id: "PK18"
  title: "Recycling Infrastructure Sorting Mandates"
  category: "Regulatory"
  status: "verified"
  summary: "Establishes automated optical sorting recognition standards for municipal recovery facilities."
  effectiveDate: "2026-01-01"
PK19:
  id: "PK19"
  title: "Cross-Border Packaging Tax Frameworks"
  category: "Regulatory"
  status: "verified"
  summary: "Applies non-recyclable plastic packaging levies based on national weight quotas."
  effectiveDate: "2026-01-01"